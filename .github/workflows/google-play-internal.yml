name: Deploy Android to Google Play Internal

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Optional override; must be higher than every version code currently in Google Play
        required: false
        default: ""
        type: string
      build_only:
        description: Build signed AAB without uploading; retain only on this dedicated runner for listing workflow
        required: false
        default: false
        type: boolean

concurrency:
  group: personal-fitness-tracker-google-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-internal:
    # Dedicated Personal Fitness Tracker runner on .45. No GitHub-hosted runner fallback.
    runs-on: [self-hosted, Windows, X64, personal-fitness-tracker-deploy]
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Built once and reused by both steps below. No --pull: the base image is pinned by digest in the Dockerfile.
      # A stable tag keeps the npm ci layer cached between deploys (#91).
      - name: Build release image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker build -f docker/android-play.Dockerfile -t pft-google-play .
          if ($LASTEXITCODE -ne 0) { throw "Docker build failed ($LASTEXITCODE)" }

      - name: Resolve next Android version code from Google Play in Docker
        id: version_code
        shell: powershell
        env:
          ANDROID_PACKAGE_NAME: com.questspire.personalfitnesstracker
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)) {
            throw "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
          }

          $versionDir = Join-Path $env:RUNNER_TEMP "pft-version-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $versionDir | Out-Null
          $outputFile = Join-Path $versionDir 'github-output.txt'

          try {
            docker run --rm `
              --entrypoint node `
              --env GOOGLE_PLAY_SERVICE_ACCOUNT_JSON `
              --env ANDROID_PACKAGE_NAME `
              --env REQUESTED_VERSION_CODE `
              --env GITHUB_OUTPUT=/run/output/github-output.txt `
              --mount "type=bind,source=$versionDir,target=/run/output" `
              -w /app `
              pft-google-play `
              scripts/resolve-android-version-code.js
            if ($LASTEXITCODE -ne 0) { throw "Google Play version-code resolution failed ($LASTEXITCODE)" }

            $result = Get-Content $outputFile -Raw
            if ($result.Trim() -notmatch '^value=[1-9][0-9]*$') {
              throw "Invalid version-code output."
            }
            $result.Trim() | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          finally {
            Remove-Item -Recurse -Force $versionDir -ErrorAction SilentlyContinue
          }

      - name: Build signed AAB in Docker (upload only when build_only is false)
        shell: powershell
        env:
          ANDROID_VERSION_CODE: ${{ steps.version_code.outputs.value }}
          PLAY_BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD',
            'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON',
            'ANDROID_VERSION_CODE'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required value for $name is missing. See docs/google-play-deploy.md."
            }
          }

          Write-Host "DEPLOY TARGET: Google Play INTERNAL testing"
          Write-Host "Build only: $env:PLAY_BUILD_ONLY"
          Write-Host "Package: com.questspire.personalfitnesstracker"
          Write-Host "versionCode: $env:ANDROID_VERSION_CODE"

          $secretDir = Join-Path $env:RUNNER_TEMP "pft-play-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $secretDir | Out-Null
          $keyFile = Join-Path $secretDir 'personal-fitness-tracker-upload.jks'
          $serviceFile = Join-Path $secretDir 'google-play-service-account.json'
          $bundleDir = Join-Path $env:RUNNER_TEMP "body-anvil-aab\${{ github.sha }}-$env:ANDROID_VERSION_CODE"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          try {
            [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            [IO.File]::WriteAllText($serviceFile, $env:GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, [Text.UTF8Encoding]::new($false))

            docker run --rm `
              --env ANDROID_KEYSTORE_PASSWORD `
              --env ANDROID_KEY_ALIAS `
              --env ANDROID_KEY_PASSWORD `
              --env ANDROID_VERSION_CODE `
              --env PLAY_BUILD_ONLY `
              --env GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=/run/secrets/google-play-service-account.json `
              --mount "type=bind,source=$keyFile,target=/run/secrets/personal-fitness-tracker-upload.jks,readonly" `
              --mount "type=bind,source=$serviceFile,target=/run/secrets/google-play-service-account.json,readonly" `
              --mount "type=volume,source=pft-gradle-cache,target=/gradle-cache" `
              --mount "type=bind,source=$bundleDir,target=/run/bundle-output" `
              pft-google-play
            if ($LASTEXITCODE -ne 0) { throw "Google Play Docker deployment failed ($LASTEXITCODE)" }
            if ($env:PLAY_BUILD_ONLY -eq 'true') {
              "Signed AAB built without upload: $bundleDir\app-release.aab (versionCode $env:ANDROID_VERSION_CODE)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }
          finally {
            Remove-Item -Recurse -Force $secretDir -ErrorAction SilentlyContinue
          }

      # Old builds of this image only (by label). The current image and the Gradle cache volume stay.
      - name: Prune old release images
        if: always()
        shell: powershell
        run: docker image prune --force --filter "label=org.questspire.build=pft-google-play"
