<!doctype html><html><head><meta charset="utf-8"><title>#90 wireframes</title><style>
:root{--bg:#101519;--card:#20262c;--line:#3a434b;--ink:#eef1f3;--mut:#9aa5ae;--or:#ff9d42;--red:#e5484d;--amb:#f5a524;--grn:#46a758;--fld:#151a1e}
*{box-sizing:border-box}body{margin:0;background:#555;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:var(--bg);overflow:hidden;position:relative;margin:0}
.app{height:48px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.pad{padding:8px 24px}.dr{padding:12px 24px 4px;font-size:16px}
h1{margin:4px 0 2px;font-size:28px}.sub{color:var(--mut);font-size:14px}
.tr{display:flex;align-items:center;justify-content:space-between}.chipdt{border:1px solid var(--line);border-radius:22px;padding:10px 12px;font-size:15px;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.prog i{flex:1;height:3px;background:var(--line);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.eb{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--or)}
.t{font-size:22px;font-weight:800;margin:2px 0}
.tbl{border:1px solid var(--line);border-radius:12px;margin:10px 0;font-size:15px}.tbl div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line)}.tbl div:last-child{border:0}.tbl b{font-weight:700}
.btn{background:var(--or);color:#111;border-radius:14px;text-align:center;padding:15px;font-weight:700;font-size:17px;margin-top:10px}
.ghost{border:1px solid var(--line);border-radius:14px;text-align:center;padding:13px;font-weight:600;margin-top:10px;font-size:16px}
.link{color:var(--mut);text-decoration:underline;text-align:center;padding:12px 0 2px;font-size:15px}
.hl{outline:2px solid var(--or);outline-offset:3px}
.frame{width:390px;background:#000}.lbl{background:#000;color:#fff;font-size:12.5px;padding:8px 12px 10px;line-height:1.4}
.tab{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;color:var(--mut);font-size:13px}.tab b{color:var(--or)}
.sheet{position:absolute;inset:150px 0 0 0;background:var(--card);border-radius:22px 22px 0 0;padding:8px 24px;z-index:5}
.dim{position:absolute;inset:0;background:#0008;z-index:4}
.grab{width:44px;height:5px;border-radius:3px;background:var(--mut);margin:0 auto 8px}
.mh{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 20px;border-bottom:1px solid var(--line)}.mh b{font-size:17px}.mh span{color:var(--or);width:70px}.mh span:last-child{text-align:right}
.sec{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin:14px 0 6px}
.done1{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}.done1 .ok{color:var(--grn);font-weight:800}.done1 .ch{margin-left:auto;color:var(--or);font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#7a5a3a,#c9a26b 40%,#5f8a4a 70%,#d4c49a);flex:none}
.photo{height:300px;border-radius:14px;background:linear-gradient(135deg,#6b4a2c,#c9a26b 35%,#5f8a4a 60%,#d9c79c 80%,#8a5e3c);display:flex;align-items:flex-end;justify-content:center;color:#fff8;font-size:12px;padding:8px}
.note{color:var(--mut);font-size:13px;line-height:1.4}
.warn{border:1px solid var(--amb);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}.warn b{color:var(--amb)}
.err{border:1px solid var(--red);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin:8px 0}.err b{color:var(--red)}
.paste{background:var(--fld);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);height:110px;overflow:hidden;white-space:pre}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;border:1px dashed var(--amb);color:var(--amb)}
.item{border-bottom:1px solid var(--line);padding:8px 0}.item .n{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.item .n span{color:var(--mut);font-weight:400}
.macro{display:flex;gap:6px;margin-top:6px}.macro div{flex:1;background:var(--fld);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px}.macro small{display:block;color:var(--mut);font-size:10.5px}
.tot{display:flex;gap:6px;margin:8px 0}.tot div{flex:1;background:#2a3238;border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--mut)}.tot b{display:block;font-size:16px;color:var(--ink)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--line);z-index:6}.bar .btn{margin:0}
.steps{display:flex;gap:6px;padding:10px 20px 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--or)}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line);padding:6px 0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none}.ck.rep{background:#2a3238;border-color:var(--grn);color:var(--grn);font-size:13px;display:flex;align-items:center;justify-content:center}
.tm{width:66px;font-size:15px;flex:none}.nm{flex:1;font-size:16px;font-weight:600}.nm small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;border:1px solid var(--mut);color:var(--mut);margin-left:4px}
.big{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;margin:10px 0;font-size:16px;font-weight:600}.big small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.ic{width:44px;height:44px;border-radius:12px;background:#2a3238;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}

.wr{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);padding:4px 0}
.wr .nm{flex:1;font-size:15px;font-weight:700}.wr .nm small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.pl{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:600}
.dose{color:var(--mut);font-size:14px}.i{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;font-size:12px;text-align:center;line-height:19px}
.tiles3{display:flex;gap:8px;margin:10px 0}.tiles3 div{flex:1;border:1px solid var(--line);border-radius:14px;text-align:center;padding:10px 4px;color:var(--mut);font-size:13px}.tiles3 b{display:block;font-size:20px;color:var(--ink)}
.more{display:flex;justify-content:space-between;align-items:center;min-height:52px;border:1px dashed var(--line);border-radius:12px;padding:6px 14px;margin-top:10px;color:var(--ink);font-weight:600}
.tabs{display:flex;border:1px solid var(--line);border-radius:22px;margin:10px 0}.tabs div{flex:1;text-align:center;padding:10px;border-radius:22px;font-weight:600;font-size:14px;color:var(--mut)}.tabs .on{background:var(--or);color:#111}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:8px}
.opt .nm{flex:1;font-weight:700;font-size:15px}.opt .nm small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.opt.sel{border-color:var(--or);background:#2a2118}.opt.idle{opacity:.45}
.seg{display:flex;gap:4px}.seg i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.seg i.on{background:var(--or);border-color:var(--or)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none}.radio.on{border:7px solid var(--or)}
.chip2{border:1px solid var(--line);border-radius:22px;padding:6px 14px;min-height:48px;display:inline-flex;flex-direction:column;justify-content:center;margin:4px 4px 0 0;font-weight:600;font-size:14px}.chip2 small{color:var(--mut);font-weight:400;font-size:11.5px}.chip2.sel{border-color:var(--or);background:#2a2118}
.done{background:var(--or);border-color:var(--or);color:#111;display:flex;align-items:center;justify-content:center;font-size:13px}
</style></head><body><div id="x"></div><script>const F={"workout-a-card": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"dr\">\u2039 &nbsp;Mon, 2 Nov \u25be &nbsp;\u203a</div><div class=\"pad\" style=\"padding-top:0\"><div class=\"tr\"><h1>Today</h1><span class=\"chipdt\">Home day \u25be</span></div><div class=\"prog\">0 of 7 done <i></i></div><div class=\"card\"><div class=\"eb\">Today&#39;s workout</div><div class=\"t hl\">0 of 5 done \u00b7 5 left</div><div class=\"sub\">Strength workout \u00b7 plan</div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Goblet squat<span class=pl>Plan</span><small>Quadriceps \u00b7 Glutes</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"link hl\">Show all 5 \u2304</div></div></div><div class=\"tab\"><b>Today</b><span>Progress</span></div><div class=\"lbl\"><b>Workout A (recommended), card</b> \u00b7 counts only today&#39;s prescribed exercises (the plan, in the chosen full or short version). \"Show all 5\". Same layout and height as now; only the numbers change.</div>", "workout-a-sheet": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"dr\">\u2039 &nbsp;Mon, 2 Nov \u25be &nbsp;\u203a</div><div class=\"pad\" style=\"padding-top:0\"><div class=\"tr\"><h1>Today</h1><span class=\"chipdt\">Home day \u25be</span></div><div class=\"prog\">0 of 7 done <i></i></div></div><div class=\"dim\"></div><div class=\"sheet\" style=\"inset:40px 0 0 0;overflow:hidden\"><div class=\"grab\"></div><div class=\"tr\" style=\"height:44px\"><span style=\"color:var(--or)\">Close</span><b>Today&#39;s workout</b><span style=\"width:40px\"></span></div><div class=\"tiles3 hl\"><div><b>5</b>planned</div><div><b>5</b>left</div><div><b>0</b>done</div></div><div class=\"sec\">Today&#39;s plan \u00b7 by priority</div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Goblet squat<span class=pl>Plan</span><small>Quadriceps \u00b7 Glutes</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Chest press machine<span class=pl>Plan</span><small>Chest</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Lat pulldown<span class=pl>Plan</span><small>Lats</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">One-arm kettlebell row<span class=pl>Plan</span><small>Upper back \u00b7 Lats</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Hammer curls<span class=pl>Plan</span><small>Biceps</small></div><span class=\"dose\">2 \u00d7 12</span><span class=\"i\">i</span></div><div class=\"more hl\"><span>Extras \u00b7 7 more you can add<br><small style=\"color:var(--mut);font-weight:400\">Tracked separately; never part of \"of 5\"</small></span><span>\u2304</span></div></div><div class=\"lbl\"><b>Workout A, sheet</b> \u00b7 tiles and list are the plan only. The rest of the catalogue sits behind one \"Extras\" row that expands in place. A ticked extra shows as \"+1 extra\" beside the counts, never inside \"of 5\".</div>", "workout-b-sheet": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"dr\">\u2039 &nbsp;Mon, 2 Nov \u25be &nbsp;\u203a</div><div class=\"pad\" style=\"padding-top:0\"><div class=\"tr\"><h1>Today</h1><span class=\"chipdt\">Home day \u25be</span></div><div class=\"prog\">0 of 7 done <i></i></div></div><div class=\"dim\"></div><div class=\"sheet\" style=\"inset:40px 0 0 0;overflow:hidden\"><div class=\"grab\"></div><div class=\"tr\" style=\"height:44px\"><span style=\"color:var(--or)\">Close</span><b>Today&#39;s workout</b><span style=\"width:40px\"></span></div><div class=\"tabs hl\"><div class=\"on\">Today&#39;s plan \u00b7 5</div><div>All exercises \u00b7 12</div></div><div class=\"tiles3\"><div><b>5</b>planned</div><div><b>5</b>left</div><div><b>0</b>done</div></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Goblet squat<span class=pl>Plan</span><small>Quadriceps \u00b7 Glutes</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Chest press machine<span class=pl>Plan</span><small>Chest</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Lat pulldown<span class=pl>Plan</span><small>Lats</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">One-arm kettlebell row<span class=pl>Plan</span><small>Upper back \u00b7 Lats</small></div><span class=\"dose\">3 \u00d7 10</span><span class=\"i\">i</span></div><div class=\"wr\"><div class=\"ck\"></div><div class=\"nm\">Hammer curls<span class=pl>Plan</span><small>Biceps</small></div><span class=\"dose\">2 \u00d7 12</span><span class=\"i\">i</span></div></div><div class=\"lbl\"><b>Workout B, sheet</b> \u00b7 a two-way switch: Today&#39;s plan (default) or All exercises. Clearer split, but a second control in the sheet, and extras are one tap further away.</div>", "conditioning-a": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><div class=\"sec\">Evening</div><div style=\"display:flex;gap:12px;align-items:center\"><div class=\"ck\"></div><div style=\"flex:1;font-size:16px;font-weight:700;color:var(--ink)\">High-intensity conditioning<small style=\"display:block;color:var(--mut);font-weight:400;font-size:13px\">Pick one \u00b7 any one counts for today</small></div><span>\u203a</span></div><div style=\"padding-left:38px\"><div class=\"opt \"><div class=\"radio \"></div><div class=\"nm\">VR boxing<small>3 rounds \u00b7 Thrill of the Fight \u00b7 3-minute rounds</small></div><div class=\"seg\"><i></i><i></i><i></i></div></div><div class=\"opt \"><div class=\"radio \"></div><div class=\"nm\">Heavy bag rounds<small>12 min \u00b7 3 \u00d7 3-minute rounds</small></div></div><div class=\"opt \"><div class=\"radio \"></div><div class=\"nm\">Battle ropes<small>10 min \u00b7 intervals</small></div></div></div></div><div class=\"tab\"><b>Today</b><span>Progress</span></div><div class=\"lbl\"><b>Conditioning A (recommended), not started</b> \u00b7 one activity, three stacked choices (56 px each), each with its dose in the plan&#39;s words: rounds or minutes, then the detail. Content layer; about 60 px taller than the chip row.</div>", "conditioning-a-partial": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><div class=\"sec\">Evening</div><div style=\"display:flex;gap:12px;align-items:center\"><div class=\"ck\"></div><div style=\"flex:1;font-size:16px;font-weight:700;color:var(--ink)\">High-intensity conditioning<small style=\"display:block;color:var(--mut);font-weight:400;font-size:13px\">VR boxing \u00b7 1 of 3 rounds</small></div><span>\u203a</span></div><div style=\"padding-left:38px\"><div class=\"opt sel hl\"><div class=\"radio on\"></div><div class=\"nm\">VR boxing<small>1 of 3 rounds \u00b7 tap for the next round</small></div><div class=\"seg\"><i class=\"on\"></i><i></i><i></i></div></div><div class=\"opt idle\"><div class=\"radio \"></div><div class=\"nm\">Heavy bag rounds<small>12 min \u00b7 or switch to this</small></div></div><div class=\"opt idle\"><div class=\"radio \"></div><div class=\"nm\">Battle ropes<small>10 min \u00b7 or switch to this</small></div></div><div class=\"note\" style=\"margin-top:8px\">Switching keeps the round already done in history. Only one method completes conditioning.</div></div></div><div class=\"tab\"><b>Today</b><span>Progress</span></div><div class=\"lbl\"><b>Conditioning A, partial</b> \u00b7 the method in progress is highlighted with its rounds; the others stay tappable as \"or switch\". Finishing any one marks the activity done once.</div>", "conditioning-a-done": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><div class=\"sec\">Evening</div><div style=\"display:flex;gap:12px;align-items:center\"><div class=\"ck done\">\u2713</div><div style=\"flex:1;font-size:16px;font-weight:700;color:var(--mut)\">High-intensity conditioning<small style=\"display:block;color:var(--ink);font-weight:600;font-weight:400;font-size:13px\">Done with VR boxing \u00b7 3 rounds</small></div><span>\u203a</span></div><div class=\"note\" style=\"padding-left:38px;margin-top:6px\">The other methods are hidden once done. Undo or switch in the sheet (\u203a).</div></div><div class=\"tab\"><b>Today</b><span>Progress</span></div><div class=\"lbl\"><b>Conditioning A, done</b> \u00b7 collapses to one line naming the method and dose. Counts once for the day and once in muscle history.</div>", "conditioning-b": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><div class=\"sec\">Evening</div><div style=\"display:flex;gap:12px;align-items:center\"><div class=\"ck\"></div><div style=\"flex:1;font-size:16px;font-weight:700;color:var(--ink)\">High-intensity conditioning<small style=\"display:block;color:var(--mut);font-weight:400;font-size:13px\">Any one counts \u00b7 VR boxing 1 of 3</small></div><span>\u203a</span></div><div style=\"padding-left:38px\"><span class=\"chip2 sel hl\">VR boxing 1/3<small>3 rounds \u00d7 3 min</small></span><span class=\"chip2\">Heavy bag<small>12 min</small></span><span class=\"chip2\">Battle ropes<small>10 min</small></span></div></div><div class=\"tab\"><b>Today</b><span>Progress</span></div><div class=\"lbl\"><b>Conditioning B</b> \u00b7 keep the chips, add the dose as a second line and highlight the method in progress. Most compact, but chips wrap unevenly at 320 px.</div>"};document.getElementById("x").innerHTML=Object.entries(F).map(([k,h])=>{const i=h.lastIndexOf('<div class="lbl">');return `<div class="frame" id="${k}"><div class="phone">${h.slice(0,i)}</div>${h.slice(i)}</div>`}).join('<div style="height:20px"></div>');</script></body></html>
