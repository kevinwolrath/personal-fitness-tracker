<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gym layout options</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#10171b;color:#f2f4f5;font-family:Arial,sans-serif;font-size:15px}main{max-width:390px;min-height:844px;margin:auto;background:#20292f;padding:20px 20px 66px}button,input{font:inherit}button{color:inherit;cursor:pointer;background:none;border:0;padding:0;min-height:44px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;height:44px}h1{font-size:21px;margin:0}header button{color:#ffa13d;font-weight:bold}header span{width:46px}.summary{color:#aebbc2;margin:0 0 16px;line-height:21px}input[type=search]{height:46px;width:100%;border:1px solid #4b5a63;border-radius:10px;padding:0 14px;background:#121c22;color:white;outline-color:#ffa13d}.filters{display:flex;gap:8px;margin:10px 0 17px}.chip{border:1px solid #4b5a63;border-radius:24px;padding:0 14px;min-height:38px;font-size:13px}.chip.active{border-color:#ffa13d;color:#ffa13d;background:#392c21}.category{display:flex;align-items:center;justify-content:space-between;margin:9px 0 0}.category h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:0;color:#b7c3ca}.category button{color:#ffa13d;font-size:13px}.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #3c4850;padding:10px 0;min-height:80px}.thumb{width:58px;height:58px;background:#111c23;border:1px solid #34424c;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}.thumb svg{width:52px;height:52px}.words{flex:1;min-width:0}.name{font-size:16px;font-weight:bold;line-height:22px}.meta{color:#acbbc3;font-size:12px;line-height:19px;margin-top:3px}.check{appearance:none;flex:none;width:25px;height:25px;border:2px solid #80909a;border-radius:6px;position:relative;margin:0 3px 0 8px;cursor:pointer}.check:checked{background:#ffa13d;border-color:#ffa13d}.check:checked:after{content:'✓';position:absolute;inset:-1px;text-align:center;line-height:23px;color:#172027;font-size:20px;font-weight:bold}.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);height:56px;border-top:1px solid #46515a;background:#20292f;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#b7c3ca;font-size:13px}.foot button{color:#ffa13d;font-weight:bold}.section-card{border:1px solid #48555e;border-radius:12px;margin:12px 0;overflow:hidden}.section-title{padding:12px;display:flex;gap:12px;align-items:center;background:#26323a}.section-title .thumb{width:48px;height:48px}.section-card .row{margin:0 14px}.section-card .row:last-child{border:0}.station{padding:12px 14px;color:#adbdc7;font-size:12px;border-top:1px solid #46525b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.tile{border:1px solid #46565f;border-radius:12px;background:#172128;padding:10px;position:relative;min-height:192px}.tile .thumb{width:100%;height:112px;border:0;background:#101a21}.tile .thumb svg{width:100px;height:100px}.tile .check{position:absolute;top:15px;right:12px}.tile .name{font-size:15px;margin-top:10px}.tile .meta{font-size:12px}.note{font-size:12px;color:#aebdc5;line-height:18px}dialog{border:1px solid #54616a;border-radius:16px;background:#20292f;color:white;width:350px;padding:18px}dialog::backdrop{background:#000a}dialog .thumb{width:100%;height:220px}dialog .thumb svg{width:190px;height:190px}dialog h2{margin-top:12px}dialog button{color:#ffa13d}a{color:#ffa13d}
</style><main><header><button onclick="location.href='?option=a'">Close</button><h1>My Gym</h1><span></span></header><p class="summary">Your equipment. Your exercise choices.<br><strong id="count">6 selected</strong> · bodyweight always available</p><input type="search" aria-label="Search equipment" placeholder="Search equipment or machine"><div class="filters"><button class="chip active" onclick="filterSelected(false,this)">All equipment</button><button class="chip" onclick="filterSelected(true,this)">Selected only</button></div><div id="content"></div><p class="note">Tap an equipment image to see its stations and exercises.</p></main><div class="foot"><span>Selections saved on this device</span><button onclick="document.querySelectorAll('.check').forEach(x=>x.checked=x.defaultChecked);update()">Undo</button></div><dialog id="detail"><button onclick="this.closest('dialog').close()">Close details</button><div id="detail-art"></div><h2 id="detail-name"></h2><p class="summary">Equipment details and supported exercises</p><p>Only the stations you select count as available.</p><button onclick="this.closest('dialog').close()">Back to My Gym</button></dialog><script>
const svg=(s)=>`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#9cacb6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
const art={kettle:svg('<path d="M43 48V34a17 17 0 0 1 34 0v14" stroke="#ff9e36"/><path d="M37 49Q24 75 29 94Q60 110 91 94Q96 75 83 49Z" fill="#3d4a54"/><path d="M48 66Q41 77 43 87" stroke="#80909a"/>'),dumbbell:svg('<path d="M34 60h52" stroke="#ff9e36" stroke-width="9"/><path d="M17 40h20v40H17zM83 40h20v40H83z" fill="#3d4a54"/><path d="M10 48v24M110 48v24"/>'),barbell:svg('<path d="M9 61h102" stroke="#ff9e36"/><path d="M24 38h14v46H24zM82 38h14v46H82z" fill="#3d4a54"/><path d="M15 46v30M105 46v30"/>'),bench:svg('<path d="M18 56h83v13H18z" fill="#e68c31" stroke="#e68c31"/><path d="M34 71l-8 32M86 71l9 32M18 105h20M86 105h18"/>'),gym:svg('<path d="M28 106V15h65v91M19 106h83M30 18l-14 20M93 18l13 20"/><path d="M77 36h12v43H77z" fill="#3d4a54"/><path d="M78 45h10M78 54h10M78 63h10M78 72h10" stroke-width="2"/><path d="M52 38v34M37 75h34M46 75v31M53 32h17M58 32v-8" stroke="#ff9e36"/>'),pulldown:svg('<path d="M27 108V15h68v93M14 109h91"/><path d="M64 17v29M38 46h50M40 46l-10 9M86 46l10 9" stroke="#ff9e36"/><path d="M38 80h39M50 82v26M77 61h15v37H77z"/>'),extension:svg('<path d="M24 28l12 49h47M34 77v27M79 77l14 23M19 106h25M88 105h15"/><path d="M31 48l7 22M39 72h39M80 75l-6 20M63 97h26" stroke="#ff9e36" stroke-width="9"/>'),press:svg('<path d="M24 106V20h67v86M14 108h91M43 73h35M48 74v32M42 43v30"/><path d="M30 38l19 13M90 38L71 51M49 51v15M71 51v15" stroke="#ff9e36"/><path d="M82 60v35"/>')};
const items=[['Kettlebells','4 exercises','kettle',true],['Dumbbells','7 exercises','dumbbell',true],['Barbell','6 exercises','barbell',false],['Adjustable bench','5 exercises','bench',true],['Chest press station','Chest press','press',true],['Lat pulldown station','Lat pulldown','pulldown',true],['Leg extension station','Leg extension','extension',false]];
function image(i){return `<button class="thumb" aria-label="View ${i[0]}" onclick="showDetail('${i[0]}','${i[2]}')">${art[i[2]]}</button>`}
function row(i){return `<div class="row" data-selected="${i[3]}">${image(i)}<div class="words"><div class="name">${i[0]}</div><div class="meta">${i[1]}</div></div><input class="check" type="checkbox" aria-label="Available: ${i[0]}" ${i[3]?'checked':''} onchange="update()"></div>`}
function heading(name,count){return `<div class="category"><h2>${name} <span style="font-weight:normal">${count}</span></h2><button onclick="selectCategory(this)">Select all</button></div>`}
const option=new URLSearchParams(location.search).get('option')||'a';
if(option==='a')content.innerHTML=`${heading('Free weights','3 / 8')}${items.slice(0,4).map(row).join('')}${heading('Multi-gym stations','2 / 5')}<p class="note" style="margin:0 0 4px">Fortis multi-gym · select each station you have</p>${items.slice(4).map(row).join('')}`;
if(option==='b')content.innerHTML=`<div class="section-card"><div class="section-title">${image(['Free weights','','dumbbell'])}<div class="words"><div class="name">Free weights</div><div class="meta">3 of 8 selected · 12 exercises</div></div><button aria-label="Expand free weights" onclick="this.parentElement.nextElementSibling.hidden=!this.parentElement.nextElementSibling.hidden">⌄</button></div><div hidden>${items.slice(0,4).map(row).join('')}</div></div><div class="section-card"><div class="section-title">${image(['Fortis multi-gym','','gym'])}<div class="words"><div class="name">Fortis multi-gym</div><div class="meta">2 stations selected</div></div><button aria-label="Collapse multi-gym" onclick="this.parentElement.nextElementSibling.hidden=!this.parentElement.nextElementSibling.hidden">⌃</button></div><div><div class="station">Tick only the stations on your machine</div>${items.slice(4).map(row).join('')}<div class="station"><button style="color:#ffa13d">View all 5 stations →</button></div></div></div><div class="section-card"><div class="section-title">${image(['Benches and racks','','bench'])}<div class="words"><div class="name">Benches & racks</div><div class="meta">1 of 6 selected</div></div><button aria-label="Expand benches">⌄</button></div></div><div class="section-card"><div class="section-title">${image(['Cable stations','','pulldown'])}<div class="words"><div class="name">Cable stations</div><div class="meta">None selected</div></div><button aria-label="Expand cables">⌄</button></div></div>`;
if(option==='c')content.innerHTML=`<div class="filters" style="margin-top:0"><button class="chip active">All categories</button><button class="chip">Free weights</button><button class="chip">Machines</button></div><div class="grid">${items.slice(0,6).map(i=>`<div class="tile">${image(i)}<input class="check" type="checkbox" aria-label="Available: ${i[0]}" ${i[3]?'checked':''} onchange="update()"><div class="name">${i[0]}</div><div class="meta">${i[1]}</div></div>`).join('')}</div>`;
function update(){document.querySelector('#count').textContent=document.querySelectorAll('.check:checked').length+' selected';document.querySelectorAll('.row,.tile').forEach(x=>x.dataset.selected=x.querySelector('.check').checked)}
function filterSelected(on,button){document.querySelectorAll('.row,.tile').forEach(x=>x.hidden=on&&!x.querySelector('.check').checked);document.querySelectorAll('.filters:first-of-type .chip').forEach(x=>x.classList.toggle('active',x===button))}
function selectCategory(button){let x=button.parentElement.nextElementSibling;while(x&&!x.classList.contains('category')){x.querySelectorAll('.check').forEach(c=>c.checked=true);x=x.nextElementSibling}update()}
function showDetail(name,key){document.querySelector('#detail-art').innerHTML='<div class="thumb">'+art[key]+'</div>';document.querySelector('#detail-name').textContent=name;document.querySelector('#detail').showModal()}
document.querySelector('input[type=search]').oninput=e=>document.querySelectorAll('.row,.tile').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
</script></html>
