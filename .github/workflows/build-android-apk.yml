name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-apk:
    name: Build sideloadable debug APK
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Build Android APK in Docker
        shell: powershell
        run: |
          docker build --file docker/android.Dockerfile --tag personal-fitness-tracker-android:${{ github.run_id }} .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker run --rm `
            --volume "${{ github.workspace }}/artifacts:/output" `
            personal-fitness-tracker-android:${{ github.run_id }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify APK
        shell: powershell
        run: |
          if (-not (Test-Path "artifacts/personal-fitness-tracker.apk")) {
            throw "APK was not produced"
          }
          Get-Item "artifacts/personal-fitness-tracker.apk" | Format-List Name,Length,LastWriteTime

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-fitness-tracker-apk-${{ github.run_number }}
          path: artifacts/personal-fitness-tracker.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean Docker image
        if: always()
        shell: powershell
        run: docker image rm personal-fitness-tracker-android:${{ github.run_id }} --force 2>$null; exit 0
