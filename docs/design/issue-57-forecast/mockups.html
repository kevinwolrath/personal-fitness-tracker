<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#101519;--card:#20262c;--line:#3a434b;--ink:#eef1f3;--mut:#9aa5ae;--or:#ff9d42;--red:#e5484d;--amb:#f5a524;--grn:#46a758;--fld:#151a1e}
*{box-sizing:border-box}body{margin:0;background:#555;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:var(--bg);overflow:hidden;position:relative;margin:0}
.app{height:48px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.pad{padding:8px 24px}.dr{padding:12px 24px 4px;font-size:16px}
h1{margin:4px 0 2px;font-size:28px}.sub{color:var(--mut);font-size:14px}
.tr{display:flex;align-items:center;justify-content:space-between}.chipdt{border:1px solid var(--line);border-radius:22px;padding:10px 12px;font-size:15px;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.prog i{flex:1;height:3px;background:var(--line);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.eb{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--or)}
.t{font-size:22px;font-weight:800;margin:2px 0}
.tbl{border:1px solid var(--line);border-radius:12px;margin:10px 0;font-size:15px}.tbl div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line)}.tbl div:last-child{border:0}.tbl b{font-weight:700}
.btn{background:var(--or);color:#111;border-radius:14px;text-align:center;padding:15px;font-weight:700;font-size:17px;margin-top:10px}
.ghost{border:1px solid var(--line);border-radius:14px;text-align:center;padding:13px;font-weight:600;margin-top:10px;font-size:16px}
.link{color:var(--mut);text-decoration:underline;text-align:center;padding:12px 0 2px;font-size:15px}
.hl{outline:2px solid var(--or);outline-offset:3px}
.frame{width:390px;background:#000}.lbl{background:#000;color:#fff;font-size:12.5px;padding:8px 12px 10px;line-height:1.4}
.tab{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;color:var(--mut);font-size:13px}.tab b{color:var(--or)}
.sheet{position:absolute;inset:150px 0 0 0;background:var(--card);border-radius:22px 22px 0 0;padding:8px 24px;z-index:5}
.dim{position:absolute;inset:0;background:#0008;z-index:4}
.grab{width:44px;height:5px;border-radius:3px;background:var(--mut);margin:0 auto 8px}
.mh{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 20px;border-bottom:1px solid var(--line)}.mh b{font-size:17px}.mh span{color:var(--or);width:70px}.mh span:last-child{text-align:right}
.sec{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin:14px 0 6px}
.done1{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}.done1 .ok{color:var(--grn);font-weight:800}.done1 .ch{margin-left:auto;color:var(--or);font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#7a5a3a,#c9a26b 40%,#5f8a4a 70%,#d4c49a);flex:none}
.photo{height:300px;border-radius:14px;background:linear-gradient(135deg,#6b4a2c,#c9a26b 35%,#5f8a4a 60%,#d9c79c 80%,#8a5e3c);display:flex;align-items:flex-end;justify-content:center;color:#fff8;font-size:12px;padding:8px}
.note{color:var(--mut);font-size:13px;line-height:1.4}
.warn{border:1px solid var(--amb);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}.warn b{color:var(--amb)}
.err{border:1px solid var(--red);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin:8px 0}.err b{color:var(--red)}
.paste{background:var(--fld);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);height:110px;overflow:hidden;white-space:pre}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;border:1px dashed var(--amb);color:var(--amb)}
.item{border-bottom:1px solid var(--line);padding:8px 0}.item .n{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.item .n span{color:var(--mut);font-weight:400}
.macro{display:flex;gap:6px;margin-top:6px}.macro div{flex:1;background:var(--fld);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px}.macro small{display:block;color:var(--mut);font-size:10.5px}
.tot{display:flex;gap:6px;margin:8px 0}.tot div{flex:1;background:#2a3238;border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--mut)}.tot b{display:block;font-size:16px;color:var(--ink)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--line);z-index:6}.bar .btn{margin:0}
.steps{display:flex;gap:6px;padding:10px 20px 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--or)}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line);padding:6px 0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none}.ck.rep{background:#2a3238;border-color:var(--grn);color:var(--grn);font-size:13px;display:flex;align-items:center;justify-content:center}
.tm{width:66px;font-size:15px;flex:none}.nm{flex:1;font-size:16px;font-weight:600}.nm small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;border:1px solid var(--mut);color:var(--mut);margin-left:4px}
.big{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;margin:10px 0;font-size:16px;font-weight:600}.big small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.ic{width:44px;height:44px;border-radius:12px;background:#2a3238;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}

.chart{height:170px;border:1px solid var(--line);border-radius:12px;margin-top:8px;position:relative;overflow:hidden}
.ins{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--card)}
.ins b{font-size:16px}.ins .eb{color:var(--or)}
.li{color:var(--mut);font-size:13.5px;line-height:1.45;margin-top:4px}
.ban{border:1px solid var(--amb);border-radius:14px;padding:12px;margin:10px 0;font-size:14px;line-height:1.4}
.x{float:right;color:var(--mut)}
.leg{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:6px}
</style></head><body><div id="x"></div><script>const F={"a-progress": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><h1>Progress</h1><div class=\"sub\">30 days \u25be \u00b7 Edit charts</div><div class=\"ins hl\"><div class=\"eb\">Trend</div><b>Flat for 4 weeks</b><div class=\"li\">\u2248 0.0 kg/week (last 4 weeks, after your first 2 weeks). As you get lighter you use a little less energy; a flat trend means intake and use now balance.</div><div class=\"li\" style=\"color:var(--or);margin-top:8px\">What you can try \u2304</div></div><div class=\"card\"><div class=\"eb\">Goal</div><div class=\"t\">78.0 kg</div><div class=\"sub\">Forecast 85\u201388 kg in 12 weeks \u00b7 not on course for 78 kg yet <span class=\"tag\">Estimate</span></div><div class=\"chart\"><svg width=\"100%\" height=\"170\" viewBox=\"0 0 340 170\"><path d=\"M210,95 L330,30 L330,150 Z\" fill=\"#ff9d4222\"/><path d=\"M10,40 L30,50 L50,58 L70,64 L90,72 L110,76 L130,82 L150,85 L170,90 L190,93 L210,95\" stroke=\"#eef1f3\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"10\" cy=\"36\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"30\" cy=\"55\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"50\" cy=\"54\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"70\" cy=\"69\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"90\" cy=\"68\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"110\" cy=\"81\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"130\" cy=\"78\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"150\" cy=\"90\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"170\" cy=\"86\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"190\" cy=\"98\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"210\" cy=\"91\" r=\"3\" fill=\"#ff9d42\"/><path d=\"M210,95 L330,90\" stroke=\"#ff9d42\" stroke-width=\"2\" stroke-dasharray=\"5 4\" fill=\"none\"/><line x1=\"0\" y1=\"135\" x2=\"340\" y2=\"135\" stroke=\"#9aa5ae\" stroke-dasharray=\"3 3\"/><text x=\"4\" y=\"130\" fill=\"#9aa5ae\" font-size=\"10\">Goal 78 kg</text><line x1=\"210\" y1=\"0\" x2=\"210\" y2=\"170\" stroke=\"#3a434b\"/><text x=\"214\" y=\"12\" fill=\"#9aa5ae\" font-size=\"10\">today</text></svg></div><div class=\"leg\"><span>\u2014 7-day average</span><span style=\"color:var(--or)\">- - forecast</span><span>\u2592 range</span></div></div></div><div class=\"tab\"><span>Today</span><b>Progress</b></div><div class=\"lbl\"><b>A (recommended)</b> \u00b7 a <b>Trend</b> card at the top of Progress (content layer, under the range) with the plain status and optional steps behind \"What you can try\". The Goal chart gains the dashed forecast and its widening range, labelled Estimate.</div>", "a-steps": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><h1>Progress</h1><div class=\"sub\">30 days \u25be \u00b7 Edit charts</div><div class=\"ins\"><div class=\"eb\">Trend \u00b7 Flat for 4 weeks</div><div class=\"li\">\u2022 Check how complete your food logs are<br>\u2022 Look at steps and workouts over the month<br>\u2022 Keep protein and strength training up<br>\u2022 Sleep and stress move water weight<br>\u2022 If it stays flat, a small plan change is your choice</div><div class=\"li\" style=\"margin-top:8px\">Nothing changes in your plan unless you change it.</div></div></div><div class=\"tab\"><span>Today</span><b>Progress</b></div><div class=\"lbl\"><b>A, expanded</b> \u00b7 the optional steps. No automatic target or training changes; the last step points to Configure with AI.</div>", "b-progress": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><h1>Progress</h1><div class=\"sub\">30 days \u25be \u00b7 Edit charts</div><div class=\"card\"><div class=\"eb\">Weight</div><div class=\"t\">91.6 kg</div><div class=\"sub\">7-day average \u00b7 flat for 4 weeks</div><div class=\"chart\"><svg width=\"100%\" height=\"170\" viewBox=\"0 0 340 170\"><path d=\"M210,95 L330,30 L330,150 Z\" fill=\"#ff9d4222\"/><path d=\"M10,40 L30,50 L50,58 L70,64 L90,72 L110,76 L130,82 L150,85 L170,90 L190,93 L210,95\" stroke=\"#eef1f3\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"10\" cy=\"36\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"30\" cy=\"55\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"50\" cy=\"54\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"70\" cy=\"69\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"90\" cy=\"68\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"110\" cy=\"81\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"130\" cy=\"78\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"150\" cy=\"90\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"170\" cy=\"86\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"190\" cy=\"98\" r=\"3\" fill=\"#ff9d42\"/><circle cx=\"210\" cy=\"91\" r=\"3\" fill=\"#ff9d42\"/><path d=\"M210,95 L330,90\" stroke=\"#ff9d42\" stroke-width=\"2\" stroke-dasharray=\"5 4\" fill=\"none\"/><line x1=\"0\" y1=\"135\" x2=\"340\" y2=\"135\" stroke=\"#9aa5ae\" stroke-dasharray=\"3 3\"/><text x=\"4\" y=\"130\" fill=\"#9aa5ae\" font-size=\"10\">Goal 78 kg</text><line x1=\"210\" y1=\"0\" x2=\"210\" y2=\"170\" stroke=\"#3a434b\"/><text x=\"214\" y=\"12\" fill=\"#9aa5ae\" font-size=\"10\">today</text></svg></div><div class=\"li hl\">Flat for 4 weeks. As you get lighter you use a little less energy\u2026 <span style=\"color:var(--or)\">More</span></div></div></div><div class=\"tab\"><span>Today</span><b>Progress</b></div><div class=\"lbl\"><b>B</b> \u00b7 no new card: the forecast and the plateau note live inside the Weight chart. Less on screen, but easy to miss.</div>", "alert": "<div class=\"app\">\u2630 <span>Body Anvil</span></div><div class=\"pad\"><div class=\"dr\" style=\"padding:8px 0\">\u2039 Mon, 23 Nov \u25be \u203a</div><h1>Today</h1><div class=\"ban hl\"><span class=\"x\">\u2715</span><b>Your weight trend has been flat for 4 weeks.</b><br><span style=\"color:var(--mut)\">See what you can try in Progress.</span></div><div class=\"card\"><div class=\"eb\">Do this next</div><div class=\"t\">School run</div></div></div><div class=\"tab\"><span>Today</span><b>Progress</b></div><div class=\"lbl\"><b>Alert (both options)</b> \u00b7 shown once per new finding, at most once a week, only with fresh weigh-ins and 3+ weeks of evidence; dismissible; can be turned off in Settings. A phone notification only if reminders are on.</div>"};document.getElementById("x").innerHTML=Object.entries(F).map(([k,h])=>{const i=h.lastIndexOf('<div class="lbl">');return `<div class="frame" id="${k}"><div class="phone">${h.slice(0,i)}</div>${h.slice(i)}</div>`}).join('<div style="height:20px"></div>');</script></body></html>
